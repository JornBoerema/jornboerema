<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Download Even for macOS and Windows: Even mailen and Even doen in one desktop app, and Even vastleggen for screenshots." />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f07a2b" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preload" href="/src/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/style.css" />
    <title>Download Even</title>
  </head>
  <body>
    <main class="is-download">
      <header>
        <nav class="crumb" aria-label="Breadcrumb"><a href="/">Even</a> / download</nav>
        <h1>Download</h1>
      </header>

      <section class="download" aria-labelledby="app-even">
        <h2 id="app-even">Even</h2>
        <p class="intro" data-i18n="intro">Even mailen and Even doen in one desktop app.</p>
        <a class="download-button" id="primary" href="#"><span class="label">download</span><span class="file">↓</span></a>
        <p class="download-meta">
          <span><span data-i18n="alsoFor">also for</span> <span id="others"></span></span>
          <span id="version"></span>
        </p>
      </section>

      <section class="download" aria-labelledby="app-capture">
        <h2 id="app-capture">Even vastleggen</h2>
        <p class="intro" data-i18n="introCapture">Screenshots in a moment: capture, draw on it, copy or save.</p>
        <a class="download-button" id="primary-capture" href="#"><span class="label">download</span><span class="file">↓</span></a>
        <p class="download-meta">
          <span><span data-i18n="alsoFor">also for</span> <span id="others-capture"></span></span>
          <span id="version-capture"></span>
        </p>
      </section>

      <footer>
        <span>© 2026</span>
        <a href="https://github.com/JornBoerema/jornboerema/tree/main/apps/desktop" target="_blank" rel="noopener" data-i18n="source">source</a>
        <button type="button" id="language">nl</button>
      </footer>
    </main>
    <script type="module" src="/src/download-even.ts"></script>
      <script src="/stats.js" defer></script>
  </body>
</html>
