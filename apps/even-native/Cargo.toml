[package]
name = "even-native"
version = "0.1.0"
description = "Even, built natively in Rust with GPUI: an experiment next to the Tauri app."
edition = "2021"
publish = false

[[bin]]
name = "even-native"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.9.1"
anyhow = "1"
ammonia = "4"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
url = "2"
# The webview engine gpui-webview builds on.
wry = { package = "lb-wry", version = "0.53.3" }
futures = "0.3"
gpui-webview = "0.9.1"
open = "5"
regex = "1"
# Splits quoted earlier mail off a reply; wry already brings it in.
kuchikiki = "0.8.8-speedreader"
# Where downloaded attachments go.
dirs = "6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
