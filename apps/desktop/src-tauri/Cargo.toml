[package]
name = "even"
version = "0.1.25"
description = "Even: Even mailen and Even doen in one desktop app"
edition = "2021"

# The executable carries the app's name: the Dock shows it while developing.
[[bin]]
name = "Even"
path = "src/main.rs"

[lib]
name = "even_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Even mailen's cache on disk (mail_cache.rs); bundled, so no system SQLite is needed.
rusqlite = { version = "0.42", features = ["bundled"] }
