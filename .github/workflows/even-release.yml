# Builds Even (the desktop app with Even mailen and Even doen) for macOS (Apple
# Silicon and Intel) and Windows. Start one by pushing a tag, e.g. `even-v0.1.0`
# (the version in apps/desktop/src-tauri/tauri.conf.json must match).
#
# Even vastleggen owns this repo's "latest" release (its website and updater
# read releases/latest), so Even never takes it. Instead:
# - each version gets its own release, created as not-latest;
# - the release `even-updates` always holds the newest latest.json (which
#   running apps check) and the installers under stable names:
#   .../releases/download/even-updates/Even-mac-apple-silicon.dmg etc.
#
# Secrets (shared with Even vastleggen):
# - TAURI_SIGNING_PRIVATE_KEY (and _PASSWORD) sign the update files.
# - MACOS_SIGNING_P12 (base64) and MACOS_SIGNING_PASSWORD: the self-signed
#   code signing certificate. Not trusted by Gatekeeper (no Apple Developer
#   account yet), but every version is signed by the same certificate.
name: Release Even

on:
  push:
    tags: ["even-v*"]

permissions:
  contents: write

env:
  UPDATES_TAG: even-updates

jobs:
  # Created here, not by tauri-action, so it is never marked as latest.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release and the updates release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#even-v}"
          configured=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          if [ "$version" != "$configured" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $configured in tauri.conf.json" >&2
            exit 1
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false \
              --title "Even $version" \
              --notes "Even: Even mailen and Even doen in one desktop app. Installed apps update themselves."
          gh release view "$UPDATES_TAG" >/dev/null 2>&1 ||
            gh release create "$UPDATES_TAG" --target main --latest=false \
              --title "Even: newest version" \
              --notes "Always the newest Even installers and update manifest. Versions have their own even-v* releases."

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg/*.dmg
            asset: Even-mac-apple-silicon.dmg
            config: --config src-tauri/tauri.macos-release.conf.json
          - runner: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg/*.dmg
            asset: Even-mac-intel.dmg
            config: --config src-tauri/tauri.macos-release.conf.json
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis/*-setup.exe
            asset: Even-windows-setup.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # A temporary keychain with our certificate, in the search list so
      # codesign finds the identity named in tauri.macos-release.conf.json.
      - name: Import signing certificate
        if: runner.os == 'macOS'
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"

      # Uploads to the release made above (found by its tag) and adds this
      # platform to its latest.json.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Even __VERSION__
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }} ${{ matrix.config }}

      # The same installer under a name that stays the same across versions.
      - name: Upload with a stable name
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          file=$(ls apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }} | head -n 1)
          cp "$file" "$RUNNER_TEMP/${{ matrix.asset }}"
          gh release upload "$UPDATES_TAG" "$RUNNER_TEMP/${{ matrix.asset }}" --clobber

  # Only once every platform is in latest.json do running apps get to see it.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Move latest.json to the updates release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir "$RUNNER_TEMP"
          jq -e '.platforms | has("darwin-aarch64") and has("darwin-x86_64") and has("windows-x86_64")' "$RUNNER_TEMP/latest.json"
          gh release upload "$UPDATES_TAG" "$RUNNER_TEMP/latest.json" --clobber
          # Even vastleggen keeps the latest release.
          [ "$(gh release view --json tagName -q .tagName)" != "$GITHUB_REF_NAME" ] || {
            echo "The Even release became latest" >&2
            exit 1
          }
